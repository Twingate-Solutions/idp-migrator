[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "twingate-idp-migrator"
version = "0.1.0"
description = "Desktop GUI tool to migrate Twingate group-to-resource mappings between identity providers"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.7,<7.0",
    "httpx>=0.27,<1.0",
    "pydantic>=2.7,<3.0",
    "pydantic-settings>=2.3,<3.0",
    "rapidfuzz>=3.9,<4.0",
    "structlog>=24.1,<25.0",
]

[project.scripts]
twingate-idp-migrator = "src.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]

[[tool.mypy.overrides]]
module = "src.ui.*"
ignore_errors = true
