name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: twingate-idp-migrator-linux-x64
            binary_suffix: ""
          - os: windows-latest
            artifact_name: twingate-idp-migrator-windows-x64.exe
            binary_suffix: ".exe"
          - os: macos-latest
            artifact_name: twingate-idp-migrator-macos-arm64
            binary_suffix: ""

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install --upgrade pip setuptools
          pip install -r requirements-dev.txt

      - name: Install Linux Qt runtime dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libgl1 \
            libegl1 \
            libxcb-cursor0 \
            libxcb-icccm4 \
            libxcb-image0 \
            libxcb-keysyms1 \
            libxcb-randr0 \
            libxcb-render-util0 \
            libxcb-shape0 \
            libxcb-xinerama0 \
            libxcb-xkb1 \
            libxkbcommon-x11-0

      - name: Build with PyInstaller
        env:
          QT_QPA_PLATFORM: offscreen
          # Build identity for the Twingate API attribution User-Agent.
          # The tag (e.g. v1.2.3) is baked into the binary; the spec strips
          # the leading "v". Falls back to 0.0.0-dev if unset.
          APP_VERSION: ${{ github.ref_name }}
        run: pyinstaller migrator.spec

      - name: Rename binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv dist/twingate-idp-migrator dist/${{ matrix.artifact_name }}

      - name: Sign binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Generate a self-signed code-signing certificate valid for 3 years
          $cert = New-SelfSignedCertificate `
            -Subject "CN=Twingate IDP Migrator" `
            -Type CodeSigning `
            -HashAlgorithm SHA256 `
            -CertStoreLocation Cert:\CurrentUser\My `
            -NotAfter (Get-Date).AddYears(3)

          # Export to a temporary PFX
          $pw = ConvertTo-SecureString "signing-temp" -Force -AsPlainText
          Export-PfxCertificate -Cert $cert -FilePath signing.pfx -Password $pw | Out-Null

          # Locate signtool from the Windows SDK (picks the latest x64 build)
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" `
            -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -like "*x64*" } |
            Sort-Object FullName -Descending |
            Select-Object -First 1 -ExpandProperty FullName

          # Sign with a public timestamp server so the signature survives cert expiry
          & $signtool sign `
            /f signing.pfx /p signing-temp `
            /fd SHA256 `
            /tr http://timestamp.digicert.com /td SHA256 `
            dist\twingate-idp-migrator.exe

          # Clean up — cert and PFX are ephemeral per-run
          Remove-Item signing.pfx
          Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)"

      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Move-Item dist/twingate-idp-migrator.exe dist/${{ matrix.artifact_name }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist/${{ matrix.artifact_name }}
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: List downloaded artifacts
        run: find dist/ -type f

      - name: Verify all artifacts present
        run: |
          for f in \
            "dist/twingate-idp-migrator-linux-x64/twingate-idp-migrator-linux-x64" \
            "dist/twingate-idp-migrator-windows-x64.exe/twingate-idp-migrator-windows-x64.exe" \
            "dist/twingate-idp-migrator-macos-arm64/twingate-idp-migrator-macos-arm64"; do
            if [ ! -f "$f" ]; then
              echo "Missing: $f"
              exit 1
            fi
            echo "Found: $f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "twingate-idp-migrator ${{ github.ref_name }}"
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') }}
          generate_release_notes: true
          files: |
            dist/twingate-idp-migrator-linux-x64/twingate-idp-migrator-linux-x64
            dist/twingate-idp-migrator-windows-x64.exe/twingate-idp-migrator-windows-x64.exe
            dist/twingate-idp-migrator-macos-arm64/twingate-idp-migrator-macos-arm64
